name: Android CI

on:
  pull_request:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      if: github.event_name == 'pull_request'
      run: ./gradlew assembleDebug

    - name: Decode Keystore
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release.p12

    - name: Build Release APK
      if: startsWith(github.ref, 'refs/tags/')
      run: ./gradlew assembleRelease
      env:
        RELEASE_STORE_FILE: release.p12
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: countdown-timer
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v5
      with:
        name: countdown-timer
        path: app/build/outputs/apk/*/*.apk
